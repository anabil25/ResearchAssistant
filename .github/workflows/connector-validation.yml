name: Connector validation

on:
  pull_request:
    paths:
      - packages/research_connectors/**
      - services/connector_adapter/**
      - packages/contracts/connector-adapter-openapi.json
      - tests/test_connector*.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.2"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Connector tests
        run: uv run pytest tests/test_connectors.py tests/test_connector_adapter.py tests/test_connector_gateway.py tests/test_public_research.py -q
      - name: Static quality
        run: |
          uv run ruff check packages/research_connectors services/connector_adapter tests/test_connector*.py tests/test_public_research.py
          uv run mypy packages/research_connectors/src services/connector_adapter/src tests/test_connector_adapter.py tests/test_connector_gateway.py tests/test_public_research.py
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
      - name: Contract drift
        run: |
          cp packages/contracts/connector-adapter-openapi.json /tmp/connector-openapi.json
          uv run python scripts/export_contracts.py
          diff --strip-trailing-cr /tmp/connector-openapi.json packages/contracts/connector-adapter-openapi.json
