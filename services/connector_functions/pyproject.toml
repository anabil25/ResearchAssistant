[project]
name = "research-assistant-connector-functions"
version = "0.1.0"
description = "Azure Functions facade for normalized research connector operations"
requires-python = ">=3.12"
dependencies = [
    "azure-functions>=1.24,<2",
    "research-assistant-connectors",
    "research-assistant-core",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
research-assistant-connectors = { workspace = true }
research-assistant-core = { workspace = true }