codeConfiguration:
    dependencyResolution: remote_build
    entryPoint: grant/main.py
    runtime: python_3_13
container:
    resources:
        cpu: "0.5"
        memory: 1Gi
description: Maps funding requirements and drafts evidence-bounded grant sections.
environmentVariables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: gpt-5.6-sol
    - name: RESEARCH_WORKSPACE_TENANT_ID
      value: ${AZURE_TENANT_ID}
    - name: RESEARCH_WORKSPACE_PROJECT_ID
      value: ${AZURE_AI_PROJECT_NAME}
    - name: AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED
      value: "false"
kind: hosted
metadata:
    tags:
        - Agent Framework
        - Research
        - Grants
        - Responses Protocol
name: grant-agent
protocols:
    - protocol: responses
      version: 2.0.0