# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '=1.32.0'
    extensions:
        azure.ai.agents: '=1.0.0-beta.12'
        azure.ai.projects: '=1.0.0-beta.7'
        microsoft.foundry: '=1.0.0-beta.2'
name: research-assistant
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.6-sol
                version: "2026-07-09"
              name: gpt-5.6-sol
              sku:
                capacity: 100
                name: DataZoneStandard
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 100
                name: DataZoneStandard
            - model:
                format: OpenAI
                name: text-embedding-3-large
                version: "1"
              name: text-embedding-3-large
              sku:
                capacity: 50
                name: DataZoneStandard
    api:
        project: .
        host: containerapp
        language: python
        module: app/api
        apiVersion: '2026-01-01'
        uses:
            - research-coordinator
            - literature-agent
            - grant-agent
            - matching-agent
            - dataset-agent
            - institution-agent
            - screening-agent
        docker:
            path: ./services/api/Dockerfile
            context: .
            image: research-assistant-api
            remoteBuild: true
        hooks:
            predeploy:
                windows:
                    shell: pwsh
                    run: ./scripts/reconcile-agents.ps1
                posix:
                    shell: sh
                    run: ./scripts/reconcile-agents.sh
            postdeploy:
                windows:
                    shell: pwsh
                    run: ./scripts/verify-deployment.ps1 api
                posix:
                    shell: sh
                    run: ./scripts/verify-deployment.sh api
    dataset-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/dataset/agent.yaml
    grant-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/grant/agent.yaml
    institution-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/institution/agent.yaml
    literature-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/literature/agent.yaml
    matching-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/matching/agent.yaml
    research-coordinator:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
            - literature-agent
            - grant-agent
            - matching-agent
            - dataset-agent
            - institution-agent
            - screening-agent
        $ref: ./agents/coordinator/agent.yaml
    screening-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/screening/agent.yaml
    web:
        project: ./apps/web
        host: containerapp
        language: js
        module: app/web
        apiVersion: '2026-01-01'
        uses:
            - api
        docker:
            path: ./Dockerfile
            remoteBuild: true
        hooks:
            postdeploy:
                windows:
                    shell: pwsh
                    run: ../../scripts/verify-deployment.ps1 web
                posix:
                    shell: sh
                    run: ../../scripts/verify-deployment.sh web
infra:
    provider: bicep
hooks:
    postdown:
        windows:
            shell: pwsh
            run: ./scripts/postdown.ps1
            interactive: false
        posix:
            shell: sh
            run: ./scripts/postdown.sh
            interactive: false
    postprovision:
        windows:
            shell: pwsh
            run: ./scripts/postprovision.ps1
        posix:
            shell: sh
            run: ./scripts/postprovision.sh
    postup:
        windows:
            shell: pwsh
            run: ./scripts/postup.ps1
            interactive: false
        posix:
            shell: sh
            run: ./scripts/postup.sh
            interactive: false
    predeploy:
        windows:
            shell: pwsh
            run: ./scripts/predeploy.ps1
        posix:
            shell: sh
            run: ./scripts/predeploy.sh
    preprovision:
        windows:
            shell: pwsh
            run: ./scripts/preprovision.ps1
        posix:
            shell: sh
            run: ./scripts/preprovision.sh
workflows:
    up:
        steps:
            - azd:
                args:
                    - provision
