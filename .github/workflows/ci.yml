name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.10.2

      - name: Restore Python environment
        run: uv sync --all-packages --group dev --frozen

      - name: Bake committed Hosted Agent source identity
        run: python -m scripts.build_agent_source_tree

      - name: Lint and type-check Python
        run: |
          uv run ruff check packages services agents scripts tests
          uv run mypy

      - name: Compile Python sources
        run: uv run python -m compileall -q packages services agents scripts

      - name: Audit Python dependencies
        run: uv run pip-audit

      - name: Export OpenAPI contract
        run: uv run python scripts/export_contracts.py

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Restore web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Validate and audit web
        working-directory: apps/web
        run: |
          npm run generate:contracts
          npm run ci
          npm audit --audit-level=moderate

      - name: Verify generated contracts are current
        run: git diff --exit-code -- packages/contracts/openapi.json apps/web/src/lib/generated-api.ts

      - name: Compile Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/app/api.bicep --stdout > /dev/null
          az bicep build --file infra/app/web.bicep --stdout > /dev/null
