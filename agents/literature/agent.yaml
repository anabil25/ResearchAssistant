codeConfiguration:
    dependencyResolution: remote_build
    entryPoint: literature/main.py
    runtime: python_3_13
container:
    resources:
        cpu: "0.5"
        memory: 1Gi
description: Produces skeptical, source-grounded literature comparisons and synthesis.
environmentVariables:
    - name: AGENT_SOURCE_TREE_DIGEST
      value: ${AGENT_SOURCE_TREE_DIGEST}
    - name: LITERATURE_LEAD_MODEL
      value: gpt-5.6-sol
    - name: LITERATURE_WORKER_MODEL
      value: gpt-5.4-mini
    - name: RESEARCH_WORKSPACE_TENANT_ID
      value: ${AZURE_TENANT_ID}
    - name: RESEARCH_WORKSPACE_PROJECT_ID
      value: ${AZURE_AI_PROJECT_NAME}
    - name: TOOLBOX_ENDPOINT
      value: ${TOOLBOX_SHARED_MCP_ENDPOINT}
    - name: AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED
      value: "false"
kind: hosted
metadata:
    tags:
        - Agent Framework
        - Research
        - Literature
        - Responses Protocol
name: literature-agent
protocols:
    - protocol: responses
      version: 2.0.0