[project]
name = "research-assistant-worker"
version = "0.1.0"
description = "In-process ingestion implementation for the Research Assistant API"
authors = [
    { name = "Nabil Ahmed", email = "128008677+anabil25@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-ai-documentintelligence==1.0.2",
    "azure-cosmos==4.16.2",
    "azure-identity>=1.25,<2",
    "azure-search-documents==12.0.0",
    "azure-storage-blob>=12.27,<13",
    "openai==2.46.0",
    "research-assistant-core",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
research-assistant-core = { workspace = true }
