[project]
name = "research-assistant"
version = "0.1.0"
description = "Evidence-governed Microsoft Foundry research assistant accelerator"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/research_core",
    "packages/research_connectors",
    "services/api",
    "services/connector_adapter",
    "services/worker",
]

[dependency-groups]
dev = [
    "agent-framework-foundry-hosting==1.0.0b260721",
    "httpx2==2.7.0",
    "mypy>=2.3.0,<3",
    "pip-audit>=2.10,<3",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "agents"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["infra/", "apps/"]
explicit_package_bases = true
files = ["packages", "services", "agents", "scripts", "tests"]
# Single mypy_path: the gates branch's packaging-derived roots, which already
# include "agents". A second `mypy_path = ["agents"]` arrived on another branch
# and was folded in here at integration -- two keys in one table is a TOML parse
# error, and keeping both would let the domains drift.
mypy_path = [
    "packages/research_core/src",
    "packages/research_connectors/src",
    "services/api/src",
    "services/connector_adapter/src",
    "services/worker/src",
    "agents",
]
