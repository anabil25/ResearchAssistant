[project]
name = "research-assistant-core"
version = "0.1.0"
description = "Deterministic research workflows, evidence contracts, and policy boundaries"
authors = [
    { name = "Nabil Ahmed", email = "128008677+anabil25@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "nbformat>=5.10,<6",
    "orjson>=3.11,<4",
    "polars>=1.35,<2",
    "pydantic>=2.12,<3",
    "python-dateutil>=2.9,<3",
    "rapidfuzz>=3.14,<4",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
