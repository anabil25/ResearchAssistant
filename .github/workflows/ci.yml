name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.10.2

      - name: Restore Python environment
        run: uv sync --all-packages --group dev --frozen

      - name: Lint and type-check Python
        run: |
          uv run ruff check packages services agents scripts tests
          uv run mypy packages/research_core/src packages/research_connectors/src services/api/src services/worker/src agents/shared scripts tests

      - name: Enforce 100% Python line and branch coverage
        id: python_coverage
        continue-on-error: true
        run: |
          mkdir -p coverage/python
          uv run pytest -q --cov --cov-report=term-missing --cov-report=json:coverage/python/coverage.json --cov-report=xml:coverage/python/coverage.xml --cov-fail-under=100

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage/python

      - name: Audit Python dependencies
        run: uv run pip-audit

      - name: Export OpenAPI contract
        run: uv run python scripts/export_contracts.py

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Restore web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Validate web contracts and static quality
        working-directory: apps/web
        run: |
          npm run generate:contracts
          npm run typecheck
          npm run lint

      - name: Enforce 100% Jest coverage
        id: jest_coverage
        continue-on-error: true
        working-directory: apps/web
        run: npm run test:coverage

      - name: Build and audit web
        working-directory: apps/web
        run: |
          npm run build
          npm audit --audit-level=moderate

      - name: Upload Jest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: apps/web/coverage

      - name: Verify generated contracts are current
        run: git diff --exit-code -- packages/contracts/openapi.json apps/web/src/lib/generated-api.ts

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run full-stack browser tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/web/playwright-report
            apps/web/test-results

      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Enforce coverage outcomes
        if: always()
        env:
          PYTHON_COVERAGE: ${{ steps.python_coverage.outcome }}
          JEST_COVERAGE: ${{ steps.jest_coverage.outcome }}
        run: |
          test "$PYTHON_COVERAGE" = "success"
          test "$JEST_COVERAGE" = "success"
