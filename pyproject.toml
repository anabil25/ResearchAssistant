[project]
name = "research-assistant"
version = "0.1.0"
description = "Evidence-governed Microsoft Foundry research assistant accelerator"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/research_core",
    "packages/research_connectors",
    "services/api",
    "services/connector_adapter",
    "services/worker",
]

[dependency-groups]
dev = [
    "agent-framework-foundry-hosting==1.0.0b260721",
    "httpx2==2.7.0",
    "mypy>=1.18,<2",
    "pip-audit>=2.10,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "respx>=0.22,<1",
    "ruff>=0.14,<1",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "agents"]

[tool.coverage.run]
branch = true
relative_files = true
source = [
    "packages/research_core/src/research_assistant_core",
    "packages/research_connectors/src/research_assistant_connectors",
    "services/api/src/research_assistant_api",
    "services/connector_adapter/src/research_assistant_connector_adapter",
    "services/worker/src/research_assistant_worker",
    "agents/shared",
    "agents/coordinator",
    "agents/dataset",
    "agents/grant",
    "agents/grant_online",
    "agents/institution",
    "agents/literature",
    "agents/literature_online",
    "agents/matching",
    "agents/matching_online",
]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
skip_empty = true

[tool.coverage.json]
output = "coverage/python/coverage.json"
pretty_print = true

[tool.coverage.xml]
output = "coverage/python/coverage.xml"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["infra/", "apps/"]
