# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.7'
        azure.ai.projects: '>=1.0.0-beta.3'
        microsoft.foundry: '>=1.0.0-beta.1'
name: research-assistant
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.6-sol
                version: "2026-07-09"
              name: gpt-5.6-sol
              sku:
                capacity: 30
                name: DataZoneStandard
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 30
                name: DataZoneStandard
            - model:
                format: OpenAI
                name: text-embedding-3-large
                version: "1"
              name: text-embedding-3-large
              sku:
                capacity: 50
                name: DataZoneStandard
    api:
        project: .
        host: containerapp
        language: python
        docker:
            path: ./services/api/Dockerfile
            context: .
            image: research-assistant-api
            remoteBuild: true
    connector-adapter:
        project: .
        host: containerapp
        language: python
        docker:
            path: ./services/connector_adapter/Dockerfile
            context: .
            image: research-assistant-connector-adapter
            remoteBuild: true
    dataset-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/dataset/agent.yaml
    grant-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/grant/agent.yaml
    grant-online-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/grant_online/agent.yaml
    institution-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/institution/agent.yaml
    literature-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/literature/agent.yaml
    literature-online-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/literature_online/agent.yaml
    matching-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/matching/agent.yaml
    matching-online-agent:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/matching_online/agent.yaml
    research-coordinator:
        project: ./agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        $ref: ./agents/coordinator/agent.yaml
    web:
        project: ./apps/web
        host: containerapp
        language: js
        docker:
            path: ./Dockerfile
            remoteBuild: true
    worker:
        project: .
        host: containerapp
        language: python
        docker:
            path: ./services/worker/Dockerfile
            context: .
            image: research-assistant-worker
            remoteBuild: true
infra:
    provider: bicep
hooks:
    postdeploy:
        windows:
            shell: pwsh
            run: ./scripts/postdeploy.ps1
        posix:
            shell: sh
            run: ./scripts/postdeploy.sh
    postprovision:
        windows:
            shell: pwsh
            run: ./scripts/postprovision.ps1
        posix:
            shell: sh
            run: ./scripts/postprovision.sh
    predeploy:
        windows:
            shell: pwsh
            run: ./scripts/predeploy.ps1
        posix:
            shell: sh
            run: ./scripts/predeploy.sh
    preprovision:
        windows:
            shell: pwsh
            run: ./scripts/preprovision.ps1
        posix:
            shell: sh
            run: ./scripts/preprovision.sh
workflows:
    up:
        steps:
            - azd:
                args:
                    - provision
            - azd:
                args:
                    - deploy
                    - --all
