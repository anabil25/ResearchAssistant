name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.10.2

      - name: Restore Python environment
        run: uv sync --all-packages --group dev --frozen

      - name: Bake committed Hosted Agent source identity
        run: python -m scripts.build_agent_source_tree

      - name: Lint and type-check Python
        run: |
          uv run ruff check packages services agents scripts tests
          uv run mypy --linecount-report coverage/python/mypy-domain

      - name: Enforce 100% Python line and branch coverage
        id: python_coverage
        continue-on-error: true
        run: |
          mkdir -p coverage/python
          uv run pytest -q --cov --cov-report=term-missing --cov-report=html:coverage/python/html --cov-report=json:coverage/python/coverage.json --cov-report=xml:coverage/python/coverage.xml --cov-fail-under=100

      - name: Enforce exact suppression and coverage domain
        id: suppression_contract
        continue-on-error: true
        run: uv run python scripts/check_suppression_contract.py

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage/python

      - name: Audit Python dependencies
        run: uv run pip-audit

      - name: Export OpenAPI contract
        run: uv run python scripts/export_contracts.py

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Restore web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Validate and audit web
        working-directory: apps/web
        run: |
          npm run generate:contracts
          npm run ci
          npm audit --audit-level=moderate

      - name: Verify generated contracts are current
        run: git diff --exit-code -- packages/contracts/openapi.json apps/web/src/lib/generated-api.ts

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run full-stack browser tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      # Both Python gates run with continue-on-error so a failing coverage gate
      # cannot mask a failing contract gate; this step is what actually fails the
      # job. Web coverage is enforced inline by `npm run ci` (test:coverage) and
      # the browser suite fails its own step directly, so neither needs an id here.
      - name: Enforce release-gate outcomes
        if: always()
        env:
          PYTHON_COVERAGE: ${{ steps.python_coverage.outcome }}
          SUPPRESSION_CONTRACT: ${{ steps.suppression_contract.outcome }}
        run: |
          test "$PYTHON_COVERAGE" = "success"
          test "$SUPPRESSION_CONTRACT" = "success"
