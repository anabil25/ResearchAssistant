name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.10.2

      - name: Restore Python environment
        run: uv sync --all-packages --group dev --frozen

      - name: Lint, type-check, test, and audit Python
        run: |
          uv run ruff check packages services agents scripts tests
          uv run mypy packages/research_core/src packages/research_connectors/src services/api/src services/worker/src agents/shared scripts tests
          uv run pytest -q
          uv run pip-audit

      - name: Export OpenAPI contract
        run: uv run python scripts/export_contracts.py

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Restore web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Validate and audit web
        working-directory: apps/web
        run: |
          npm run generate:contracts
          npm run ci
          npm audit --audit-level=moderate

      - name: Verify generated contracts are current
        run: git diff --exit-code -- packages/contracts/openapi.json apps/web/src/lib/generated-api.ts

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run full-stack browser tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
