codeConfiguration:
    dependencyResolution: remote_build
    entryPoint: institution/main.py
    runtime: python_3_13
container:
    resources:
        cpu: "0.5"
        memory: 1Gi
description: Answers only from authorized, versioned institutional sources.
environmentVariables:
    - name: INSTITUTION_LEAD_MODEL
      value: gpt-5.6-sol
    - name: INSTITUTION_WORKER_MODEL
      value: gpt-5.4-mini
    - name: AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED
      value: "false"
kind: hosted
metadata:
    tags:
        - Agent Framework
        - Research
        - Institutional
        - Responses Protocol
name: institution-agent
protocols:
    - protocol: responses
      version: 2.0.0