codeConfiguration:
    dependencyResolution: remote_build
    entryPoint: matching/main.py
    runtime: python_3_13
container:
    resources:
        cpu: "0.5"
        memory: 1Gi
description: Matches verified experts, facilities, equipment, methods, and templates.
environmentVariables:
    - name: AGENT_SOURCE_TREE_DIGEST
      value: ${AGENT_SOURCE_TREE_DIGEST}
    - name: MATCHING_LEAD_MODEL
      value: gpt-5.6-sol
    - name: MATCHING_WORKER_MODEL
      value: gpt-5.4-mini
    - name: TOOLBOX_ENDPOINT
      value: ${TOOLBOX_SHARED_MCP_ENDPOINT}
    - name: AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED
      value: "false"
kind: hosted
metadata:
    tags:
        - Agent Framework
        - Research
        - Matching
        - Responses Protocol
name: matching-agent
protocols:
    - protocol: responses
      version: 2.0.0