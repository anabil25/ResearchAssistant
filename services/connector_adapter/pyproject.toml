[project]
name = "research-assistant-connector-adapter"
version = "0.1.0"
description = "Narrow OpenAPI adapter for governed Research Assistant connectors"
authors = [
    { name = "Nabil Ahmed", email = "128008677+anabil25@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120,<1",
    "httpx>=0.28,<1",
    "pyjwt[crypto]==2.13.0",
    "research-assistant-connectors",
    "research-assistant-core",
    "uvicorn[standard]>=0.38,<1",
]

[project.scripts]
research-assistant-connector-adapter = "research_assistant_connector_adapter:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
research-assistant-connectors = { workspace = true }
research-assistant-core = { workspace = true }
