[project]
name = "research-assistant-worker"
version = "0.1.0"
description = "Durable ingestion and workflow worker for the Research Assistant accelerator"
authors = [
    { name = "Nabil Ahmed", email = "128008677+anabil25@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.12.0",
    "agent-framework-foundry==1.10.2",
    "azure-ai-documentintelligence==1.0.2",
    "azure-ai-projects==2.3.0",
    "azure-cosmos==4.16.2",
    "azure-identity>=1.25,<2",
    "azure-monitor-opentelemetry==1.8.9",
    "azure-search-documents==12.0.0",
    "azure-storage-blob>=12.27,<13",
    "durabletask-azuremanaged==1.7.2",
    "httpx>=0.28,<1",
    "openai==2.46.0",
    "research-assistant-core",
]

[project.scripts]
research-assistant-worker = "research_assistant_worker:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
research-assistant-core = { workspace = true }
