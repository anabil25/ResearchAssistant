[project]
name = "research-assistant"
version = "0.1.0"
description = "Evidence-governed Microsoft Foundry research assistant accelerator"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/research_core",
    "packages/research_connectors",
    "services/api",
    "services/connector_adapter",
    "services/worker",
]

[dependency-groups]
dev = [
    "agent-framework-foundry-hosting==1.0.0b260721",
    "httpx2==2.7.0",
    "mypy>=2.3.0,<3",
    "pip-audit>=2.10,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "respx>=0.22,<1",
    "ruff>=0.14,<1",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "agents"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = ["agents"]
exclude = ["infra/", "apps/"]
