codeConfiguration:
    dependencyResolution: remote_build
    entryPoint: matching_online/main.py
    runtime: python_3_13
container:
    resources:
        cpu: "0.5"
        memory: 1Gi
description: Finds public researcher and organization metadata leads without claiming availability.
environmentVariables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: gpt-5.4-mini
    - name: RESEARCH_WORKSPACE_TENANT_ID
      value: ${AZURE_TENANT_ID}
    - name: RESEARCH_WORKSPACE_PROJECT_ID
      value: ${AZURE_AI_PROJECT_NAME}
    - name: TOOLBOX_ENDPOINT
      value: ${TOOLBOX_SHARED_MCP_ENDPOINT}
    - name: AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED
      value: "false"
kind: hosted
metadata:
    tags:
        - Agent Framework
        - Research
        - Public Online
        - Matching
        - Responses Protocol
name: matching-online-agent
protocols:
    - protocol: responses
      version: 2.0.0